# New standalone host; do not replace an existing site's server blocks.
server {
    listen 80;
    server_name www.kennyspan.xyz;
    return 301 https://www.kennyspan.xyz$request_uri;
}
server {
    listen 443 ssl;
    server_name www.kennyspan.xyz;
    ssl_certificate /etc/kennysvideo-feedback/tls/fullchain.pem;
    ssl_certificate_key /etc/kennysvideo-feedback/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    client_body_timeout 10s;
    location = /api/kennysvideo/feedback {
        proxy_pass http://127.0.0.1:18790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        access_log off;
    }
    location = /api/kennysvideo/feedback/health {
        proxy_pass http://127.0.0.1:18790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
    location / { return 404; }
}
